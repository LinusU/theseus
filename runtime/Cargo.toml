[package]
name = "runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = { workspace = true }
log = { workspace = true }
num-traits = { version = "0.2.19", default-features = false }
wee_alloc = { version = "0.4.5", optional = true }
widestring = { workspace = true }
zerocopy = { workspace = true }
serde = { optional = true, version = "1.0" }

[features]
wasm = ["dep:wee_alloc"]
serde = ["dep:serde"]
